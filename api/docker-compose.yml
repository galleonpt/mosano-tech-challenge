version: '3.9'

services:
    mongo:
        image: mongo:8.0
        container_name: mosano-mongo
        ports:
            - '27017:27017'
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
            MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
        volumes:
            - mongo_data:/data/db
        networks:
            - mosano-network

    app:
        build: .
        container_name: mosano-app
        ports:
            - '3333:3333'
        volumes:
            - .:/app
            - /app/node_modules
        env_file:
            - .env
        networks:
            - mosano-network

volumes:
    mongo_data:

networks:
    mosano-network:
        driver: bridge
